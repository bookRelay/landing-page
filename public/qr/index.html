<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bookrelay</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <!--
    Task #172 — il QR code stampato (segnalibri, volantini) punta sempre qui:
    https://bookrelay.it/qr, con ?c=<campagna> facoltativo (solo a-z, 0-9, -).
    Il QR non si ristampa: quando cambia la destinazione si cambia DEST qui sotto.

    1. Conta la scansione sul server (POST /api/qr/scan, migrazione 021).
    2. Porta alla destinazione del momento con utm_source=qr, così chi si
       iscrive alla waitlist o all'app finisce nel canale "QR code" di /admin.

    Con l'APK che ha App Links (branch task/172-app-links del frontend) un
    telefono Android con l'app installata non passa nemmeno da qui: apre l'app,
    che conta la scansione da sé (opened=app).

    Quando ci saranno gli store, DEST diventa una funzione del sistema:
    Android → Play Store, iPhone → App Store, computer → landing.
  -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #F9F9F1; color: #171716; font: 16px/1.5 'DM Sans', system-ui, sans-serif; }
    main { text-align: center; padding: 0 16px; animation: in .4s ease-out both; }
    img { width: 56px; height: 56px; }
    p { margin: 12px 0 0; color: rgba(23, 23, 22, .6); font-size: 14px; }
    a { color: #B0564F; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  </style>
</head>
<body>
  <main>
    <img src="/email/bookrelay-mark.png" alt="Bookrelay">
    <p>Ti stiamo portando su Bookrelay… <a id="go" href="/?utm_source=qr&amp;utm_medium=stampa">Vai</a></p>
  </main>
  <script>
    (function () {
      var API = 'https://api.bookrelay.it/api/qr/scan';
      var params = new URLSearchParams(location.search);
      var c = (params.get('c') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 60) || 'generale';

      // Destinazione di oggi: la landing con la waitlist.
      var DEST = '/?utm_source=qr&utm_medium=stampa&utm_campaign=' + encodeURIComponent(c);
      document.getElementById('go').href = DEST;

      // sendBeacon parte anche se la pagina se ne va subito. Il corpo non
      // serve (i dati sono nell'indirizzo): c'è solo perché il proxy di
      // Google rifiuta le POST vuote.
      try { navigator.sendBeacon(API + '?c=' + encodeURIComponent(c), '1'); } catch (e) { /* non si conta */ }

      location.replace(DEST);
    })();
  </script>
</body>
</html>
